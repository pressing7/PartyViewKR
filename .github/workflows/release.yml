name: Build and release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '빌드 성공 후 릴리스와 pluginmaster.json 게시'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: partyviewkr-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned references
        run: python tools/release.py references
      - name: Verify reference API and required layouts
        run: python tools/release.py verify
      - name: Regression tests
        run: |
          dotnet run --project tests/RefreshTests.csproj -c Release
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build
        run: dotnet build src/PartyViewKR.csproj -c Release "-p:DalamudLibPath=$PWD/.build/references" --nologo
      - name: Validate versions and package
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            python tools/release.py package --tag "$TAG"
          else
            python tools/release.py package
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PartyViewKR-package
          path: release-output/*
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      github.repository == 'pressing7/PartyViewKR' &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: PartyViewKR-package
          path: release-output
      - name: Publish release, verify asset, update feed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            python tools/release.py publish --tag "$TAG"
          else
            python tools/release.py publish
          fi
